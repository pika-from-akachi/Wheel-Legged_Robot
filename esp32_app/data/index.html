<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮足机器人遥控台</title>
    <style>
        :root {
            --bg: #151515;
            --panel: #202124;
            --panel-soft: #282a2d;
            --line: #3a3d40;
            --text: #f1f3f4;
            --muted: #aeb4b9;
            --green: #46d369;
            --teal: #35c2ad;
            --red: #ff5c5c;
            --yellow: #f0b84f;
            --blue: #6bb7ff;
            --key: #303337;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            min-width: 320px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
            color: inherit;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .app {
            min-height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .topbar {
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--line);
            background: #1c1d1f;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .brand h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand span {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .pill {
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--red);
        }

        .dot.online {
            background: var(--green);
        }

        .dot.connecting {
            background: var(--yellow);
        }

        .layout {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 18px;
            display: grid;
            grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }

        .panel-title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
        }

        .panel-body {
            padding: 14px;
        }

        .enable-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-soft);
        }

        .enable-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .enable-copy strong {
            font-size: 15px;
        }

        .enable-copy span {
            color: var(--muted);
            font-size: 12px;
        }

        .switch {
            position: relative;
            width: 64px;
            height: 36px;
            flex: 0 0 auto;
        }

        .switch input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .switch span {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #46494d;
            transition: background 140ms ease;
        }

        .switch span::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            top: 4px;
            left: 4px;
            border-radius: 50%;
            background: #fff;
            transition: transform 140ms ease;
        }

        .switch input:checked + span {
            background: var(--green);
        }

        .switch input:checked + span::after {
            transform: translateX(28px);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        .wasd {
            display: grid;
            grid-template-columns: repeat(3, minmax(74px, 1fr));
            grid-template-rows: repeat(3, 74px);
            gap: 8px;
        }

        .key {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-width: 0;
            min-height: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--key);
            color: var(--text);
            user-select: none;
            touch-action: none;
        }

        .key strong {
            font-size: 26px;
            line-height: 1;
        }

        .key span {
            color: var(--muted);
            font-size: 12px;
        }

        .key.active {
            border-color: var(--teal);
            background: #1f4e48;
            box-shadow: inset 0 0 0 1px var(--teal);
        }

        .key-forward {
            grid-column: 2;
            grid-row: 1;
        }

        .key-left {
            grid-column: 1;
            grid-row: 2;
        }

        .key-stop {
            grid-column: 2;
            grid-row: 2;
            background: #493030;
        }

        .key-right {
            grid-column: 3;
            grid-row: 2;
        }

        .key-back {
            grid-column: 2;
            grid-row: 3;
        }

        .drive-readout {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .metric {
            min-height: 70px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #1b1c1e;
        }

        .metric label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .metric strong {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 24px;
            font-weight: 700;
        }

        .metric small {
            color: var(--muted);
            font-size: 12px;
            margin-left: 4px;
        }

        .settings {
            display: grid;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-soft);
        }

        .range-row {
            display: grid;
            gap: 8px;
        }

        .range-label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .range-label strong {
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--teal);
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .btn {
            min-height: 42px;
            border-radius: 8px;
            padding: 0 12px;
            font-weight: 700;
            background: var(--panel-soft);
            border: 1px solid var(--line);
        }

        .btn.primary {
            background: var(--teal);
            color: #071a17;
            border-color: var(--teal);
        }

        .btn.danger {
            background: var(--red);
            color: #210707;
            border-color: var(--red);
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .wide {
            grid-column: 1 / -1;
        }

        .wheel-table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        .wheel-table th,
        .wheel-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 13px;
        }

        .wheel-table th {
            color: var(--muted);
            font-weight: 600;
            background: #1b1c1e;
        }

        .wheel-table tr:last-child td {
            border-bottom: 0;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .online-text {
            color: var(--green);
        }

        .offline-text {
            color: var(--red);
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 42px;
            padding: 10px 18px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            background: #1c1d1f;
            font-size: 12px;
        }

        @media (max-width: 860px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .status-strip {
                width: 100%;
                margin-left: 0;
                justify-content: flex-start;
            }

            .layout {
                grid-template-columns: 1fr;
                padding: 12px;
            }
        }

        @media (max-width: 520px) {
            .wasd {
                grid-template-columns: repeat(3, minmax(58px, 1fr));
                grid-template-rows: repeat(3, 64px);
            }

            .telemetry-grid,
            .drive-readout,
            .actions {
                grid-template-columns: 1fr;
            }

            .footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <h1>轮足机器人遥控台</h1>
                <span>WiFi AP: WheelRobot-Tuning · http://192.168.4.1</span>
            </div>
            <div class="status-strip">
                <div class="pill"><span id="wsDot" class="dot"></span><span id="wsText">离线</span></div>
                <div class="pill">STM32 <span id="stmText">未知</span></div>
                <div class="pill">包 <span id="packetCount" class="mono">0</span></div>
            </div>
        </header>

        <main class="layout">
            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">WASD 遥控</h2>
                    <span id="driveState" class="pill">未使能</span>
                </div>
                <div class="panel-body">
                    <div class="enable-row">
                        <div class="enable-copy">
                            <strong>机器人使能</strong>
                            <span id="enableText">关闭</span>
                        </div>
                        <label class="switch" title="机器人使能">
                            <input id="enableSwitch" type="checkbox">
                            <span></span>
                        </label>
                    </div>

                    <div class="control-grid">
                        <div class="wasd" aria-label="WASD 方向控制">
                            <button class="key key-forward" data-key="w" aria-label="W 前进">
                                <strong>W</strong><span>前进</span>
                            </button>
                            <button class="key key-left" data-key="a" aria-label="A 左转">
                                <strong>A</strong><span>左转</span>
                            </button>
                            <button class="key key-stop" id="stopButton" aria-label="停止">
                                <strong>STOP</strong><span>停止</span>
                            </button>
                            <button class="key key-right" data-key="d" aria-label="D 右转">
                                <strong>D</strong><span>右转</span>
                            </button>
                            <button class="key key-back" data-key="s" aria-label="S 后退">
                                <strong>S</strong><span>后退</span>
                            </button>
                        </div>

                        <div class="drive-readout">
                            <div class="metric">
                                <label>油门</label>
                                <strong id="throttleValue">0</strong><small>%</small>
                            </div>
                            <div class="metric">
                                <label>转向</label>
                                <strong id="turnValue">0</strong><small>%</small>
                            </div>
                            <div class="metric">
                                <label>左轮目标</label>
                                <strong id="leftTarget">0</strong><small>rpm</small>
                            </div>
                            <div class="metric">
                                <label>右轮目标</label>
                                <strong id="rightTarget">0</strong><small>rpm</small>
                            </div>
                        </div>

                        <div class="settings">
                            <div class="range-row">
                                <div class="range-label">
                                    <span>最大速度</span>
                                    <strong><span id="maxRpmValue">220</span> rpm</strong>
                                </div>
                                <input id="maxRpm" type="range" min="40" max="500" step="10" value="220">
                            </div>
                            <div class="range-row">
                                <div class="range-label">
                                    <span>转向比例</span>
                                    <strong><span id="turnScaleValue">80</span>%</strong>
                                </div>
                                <input id="turnScale" type="range" min="30" max="100" step="5" value="80">
                            </div>
                        </div>

                        <div class="actions">
                            <button id="connectButton" class="btn primary">重新连接</button>
                            <button id="eStopButton" class="btn danger">急停</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">实时遥测</h2>
                    <span id="lastPacketAge" class="pill">无数据</span>
                </div>
                <div class="panel-body">
                    <div class="telemetry-grid">
                        <div class="metric">
                            <label>横滚</label>
                            <strong id="rollValue">0.0</strong><small>deg</small>
                        </div>
                        <div class="metric">
                            <label>俯仰</label>
                            <strong id="pitchValue">0.0</strong><small>deg</small>
                        </div>
                        <div class="metric">
                            <label>偏航</label>
                            <strong id="yawValue">0.0</strong><small>deg/s</small>
                        </div>
                        <div class="metric">
                            <label>目标角度</label>
                            <strong id="jointTorque">0.00</strong><small>rad</small>
                        </div>
                        <div class="metric">
                            <label>电流输出</label>
                            <strong id="wheelTorque">0</strong><small>raw</small>
                        </div>
                        <div class="metric">
                            <label>模式</label>
                            <strong id="modeValue">stand</strong>
                        </div>
                        <div class="wide">
                            <table class="wheel-table">
                                <thead>
                                    <tr>
                                        <th>轮毂</th>
                                        <th>速度</th>
                                        <th>电流</th>
                                        <th>温度</th>
                                        <th>在线</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>左轮</td>
                                        <td><span id="leftSpeed" class="mono">0</span> rpm</td>
                                        <td><span id="leftCurrent" class="mono">0.00</span> A</td>
                                        <td><span id="leftTemp" class="mono">0</span> C</td>
                                        <td id="leftOnline" class="offline-text">否</td>
                                    </tr>
                                    <tr>
                                        <td>右轮</td>
                                        <td><span id="rightSpeed" class="mono">0</span> rpm</td>
                                        <td><span id="rightCurrent" class="mono">0.00</span> A</td>
                                        <td><span id="rightTemp" class="mono">0</span> C</td>
                                        <td id="rightOnline" class="offline-text">否</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span id="lastCommand">最后命令: none</span>
            <span id="bridgeStatus">桥接: 未读取</span>
        </footer>
    </div>

    <script>
        const state = {
            ws: null,
            wsConnected: false,
            reconnectTimer: null,
            enabled: false,
            keys: { w: false, a: false, s: false, d: false },
            throttle: 0,
            turn: 0,
            maxRpm: 220,
            turnScale: 80,
            targetLeft: 0,
            targetRight: 0,
            packets: 0,
            lastPacketAt: 0,
            lastDriveJson: "",
            lastDriveSentAt: 0,
        };

        const el = {};

        function bindElements() {
            [
                "wsDot", "wsText", "stmText", "packetCount", "driveState",
                "enableSwitch", "enableText", "throttleValue", "turnValue",
                "leftTarget", "rightTarget", "maxRpm", "maxRpmValue",
                "turnScale", "turnScaleValue", "connectButton", "eStopButton",
                "stopButton", "lastPacketAge", "rollValue", "pitchValue",
                "yawValue", "jointTorque", "wheelTorque", "modeValue",
                "leftSpeed", "leftCurrent", "leftTemp", "leftOnline",
                "rightSpeed", "rightCurrent", "rightTemp", "rightOnline",
                "lastCommand", "bridgeStatus"
            ].forEach((id) => {
                el[id] = document.getElementById(id);
            });
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function wsUrl() {
            const host = window.location.hostname || "192.168.4.1";
            return `ws://${host}/ws`;
        }

        function setConnection(status, text) {
            el.wsDot.className = `dot ${status}`;
            el.wsText.textContent = text;
        }

        function connectWebSocket() {
            if (state.ws) {
                state.ws.onclose = null;
                state.ws.close();
            }
            setConnection("connecting", "连接中");

            try {
                state.ws = new WebSocket(wsUrl());
                state.ws.binaryType = "arraybuffer";
            } catch (error) {
                scheduleReconnect();
                return;
            }

            state.ws.onopen = () => {
                state.wsConnected = true;
                setConnection("online", "已连接");
                requestStatus();
                sendDrive(true);
            };

            state.ws.onclose = () => {
                state.wsConnected = false;
                setConnection("", "离线");
                clearKeys();
                scheduleReconnect();
            };

            state.ws.onerror = () => {
                setConnection("", "错误");
            };

            state.ws.onmessage = (event) => {
                handleMessage(event.data);
            };
        }

        function scheduleReconnect() {
            clearTimeout(state.reconnectTimer);
            state.reconnectTimer = setTimeout(connectWebSocket, 2500);
        }

        function sendJson(payload) {
            if (!state.wsConnected || !state.ws || state.ws.readyState !== WebSocket.OPEN) {
                return false;
            }
            state.ws.send(JSON.stringify(payload));
            el.lastCommand.textContent = `最后命令: ${payload.type}${payload.cmd ? "." + payload.cmd : ""}`;
            return true;
        }

        function setEnabled(enabled) {
            state.enabled = Boolean(enabled);
            el.enableSwitch.checked = state.enabled;
            el.enableText.textContent = state.enabled ? "开启" : "关闭";
            el.driveState.textContent = state.enabled ? "已使能" : "未使能";
            el.driveState.style.color = state.enabled ? "var(--green)" : "var(--muted)";

            if (state.enabled) {
                sendJson({ type: "command", cmd: "enable" });
                sendDrive(true);
            } else {
                clearKeys();
                sendDrive(true);
                sendJson({ type: "command", cmd: "disable" });
            }
        }

        function clearKeys() {
            Object.keys(state.keys).forEach((key) => {
                state.keys[key] = false;
            });
            updateKeyUi();
            computeAxes();
        }

        function updateKeyUi() {
            document.querySelectorAll("[data-key]").forEach((button) => {
                const key = button.dataset.key;
                button.classList.toggle("active", Boolean(state.keys[key]));
            });
        }

        function setKey(key, pressed) {
            if (!(key in state.keys) || state.keys[key] === pressed) {
                return;
            }
            state.keys[key] = pressed;
            updateKeyUi();
            computeAxes();
            sendDrive(true);
        }

        function computeAxes() {
            let throttle = 0;
            if (state.keys.w && !state.keys.s) throttle = 100;
            if (state.keys.s && !state.keys.w) throttle = -100;

            let turn = 0;
            if (state.keys.d && !state.keys.a) turn = state.turnScale;
            if (state.keys.a && !state.keys.d) turn = -state.turnScale;

            state.throttle = throttle;
            state.turn = turn;
            state.targetLeft = Math.round(clamp(throttle + turn, -100, 100) * state.maxRpm / 100);
            state.targetRight = Math.round(clamp(throttle - turn, -100, 100) * state.maxRpm / 100);
            renderDrive();
        }

        function renderDrive() {
            el.throttleValue.textContent = state.throttle;
            el.turnValue.textContent = state.turn;
            el.leftTarget.textContent = state.enabled ? state.targetLeft : 0;
            el.rightTarget.textContent = state.enabled ? state.targetRight : 0;
        }

        function sendDrive(force = false) {
            const now = Date.now();
            const payload = {
                type: "drive",
                enable: state.enabled ? 1 : 0,
                throttle: state.enabled ? state.throttle : 0,
                turn: state.enabled ? state.turn : 0,
                max_rpm: state.maxRpm,
            };
            const json = JSON.stringify(payload);
            if (!force && json === state.lastDriveJson && now - state.lastDriveSentAt < 100) {
                return;
            }
            state.lastDriveJson = json;
            if (sendJson(payload)) {
                state.lastDriveSentAt = now;
            }
        }

        function emergencyStop() {
            clearKeys();
            state.enabled = false;
            el.enableSwitch.checked = false;
            renderDrive();
            sendJson({ type: "drive", enable: 0, throttle: 0, turn: 0, max_rpm: state.maxRpm });
            sendJson({ type: "command", cmd: "disable" });
            setEnabled(false);
        }

        function requestStatus() {
            fetch("/state", { cache: "no-store" })
                .then((res) => res.json())
                .then((data) => {
                    const bridge = data.stm32_bridge || {};
                    el.stmText.textContent = bridge.uart_ready ? "UART OK" : "UART OFF";
                    el.bridgeStatus.textContent = `桥接: WS ${bridge.ws_clients || 0}, TX ${bridge.uart_packets_sent || 0}, ERR ${bridge.command_errors || 0}`;
                })
                .catch(() => {
                    el.bridgeStatus.textContent = "桥接: 等待 ESP32";
                });
        }

        function handleMessage(data) {
            state.packets++;
            state.lastPacketAt = Date.now();
            el.packetCount.textContent = state.packets;

            if (typeof data === "string") {
                return;
            }
            if (data instanceof Blob) {
                data.arrayBuffer().then(parseBinary);
                return;
            }
            if (data instanceof ArrayBuffer) {
                parseBinary(data);
            }
        }

        function parseBinary(buffer) {
            const view = new DataView(buffer);
            let offset = 0;
            while (offset + 6 <= buffer.byteLength) {
                if (view.getUint8(offset) !== 0xAA || view.getUint8(offset + 1) !== 0xBB) {
                    offset++;
                    continue;
                }
                const type = view.getUint8(offset + 2);
                const len = view.getUint8(offset + 3);
                const end = offset + 4 + len + 2;
                if (end > buffer.byteLength) break;

                if (type === 0x82) parseState(view, offset + 4, len);
                if (type === 0x81 && len >= 1) parseAck(view.getUint8(offset + 4));
                offset = end;
            }
        }

        function parseAck(code) {
            el.stmText.textContent = code === 0 ? "ACK OK" : `ACK ${code}`;
            el.stmText.style.color = code === 0 ? "var(--green)" : "var(--yellow)";
        }

        function parseState(view, offset, len) {
            if (len < 45) return;

            const ax = view.getFloat32(offset, true);
            const ay = view.getFloat32(offset + 4, true);
            const az = view.getFloat32(offset + 8, true);
            const gz = view.getFloat32(offset + 20, true);

            const roll = Math.atan2(ay, az) * 180 / Math.PI;
            const pitch = Math.atan2(-ax, Math.sqrt(ay * ay + az * az)) * 180 / Math.PI;
            el.rollValue.textContent = roll.toFixed(1);
            el.pitchValue.textContent = pitch.toFixed(1);
            el.yawValue.textContent = gz.toFixed(1);

            const leftOffset = offset + 24;
            const rightOffset = offset + 30;
            updateWheel("left", view, leftOffset);
            updateWheel("right", view, rightOffset);

            el.jointTorque.textContent = view.getFloat32(offset + 36, true).toFixed(2);
            el.wheelTorque.textContent = view.getFloat32(offset + 40, true).toFixed(2);
            const modeId = view.getUint8(offset + 44);
            el.modeValue.textContent = ["stand", "drive", "sit", "jump", "stop", "cal"][modeId] || String(modeId);
        }

        function updateWheel(side, view, offset) {
            const speed = view.getInt16(offset, true);
            const current = view.getInt16(offset + 2, true) / 1000;
            const temp = view.getUint8(offset + 4);
            const online = view.getUint8(offset + 5) !== 0;
            el[`${side}Speed`].textContent = speed;
            el[`${side}Current`].textContent = current.toFixed(2);
            el[`${side}Temp`].textContent = temp;
            el[`${side}Online`].textContent = online ? "是" : "否";
            el[`${side}Online`].className = online ? "online-text" : "offline-text";
        }

        function initControls() {
            el.enableSwitch.addEventListener("change", () => setEnabled(el.enableSwitch.checked));
            el.connectButton.addEventListener("click", connectWebSocket);
            el.eStopButton.addEventListener("click", emergencyStop);
            el.stopButton.addEventListener("click", () => {
                clearKeys();
                sendDrive(true);
            });

            el.maxRpm.addEventListener("input", () => {
                state.maxRpm = Number(el.maxRpm.value);
                el.maxRpmValue.textContent = state.maxRpm;
                computeAxes();
                sendDrive(true);
            });

            el.turnScale.addEventListener("input", () => {
                state.turnScale = Number(el.turnScale.value);
                el.turnScaleValue.textContent = state.turnScale;
                computeAxes();
                sendDrive(true);
            });

            document.querySelectorAll("[data-key]").forEach((button) => {
                const key = button.dataset.key;
                button.addEventListener("pointerdown", (event) => {
                    event.preventDefault();
                    button.setPointerCapture(event.pointerId);
                    setKey(key, true);
                });
                button.addEventListener("pointerup", () => setKey(key, false));
                button.addEventListener("pointercancel", () => setKey(key, false));
                button.addEventListener("pointerleave", () => setKey(key, false));
            });

            window.addEventListener("keydown", (event) => {
                const tag = event.target && event.target.tagName;
                if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
                const key = event.key.toLowerCase();
                if (key in state.keys) {
                    event.preventDefault();
                    setKey(key, true);
                }
            });

            window.addEventListener("keyup", (event) => {
                const key = event.key.toLowerCase();
                if (key in state.keys) {
                    event.preventDefault();
                    setKey(key, false);
                }
            });

            window.addEventListener("blur", () => {
                clearKeys();
                sendDrive(true);
            });

            window.addEventListener("beforeunload", () => {
                if (state.wsConnected) {
                    sendJson({ type: "drive", enable: 0, throttle: 0, turn: 0, max_rpm: state.maxRpm });
                }
            });
        }

        function tick() {
            if (state.enabled && state.wsConnected && (state.throttle !== 0 || state.turn !== 0)) {
                sendDrive(false);
            }
            if (state.lastPacketAt) {
                const age = Math.round((Date.now() - state.lastPacketAt) / 1000);
                el.lastPacketAge.textContent = `${age}s 前`;
            }
        }

        bindElements();
        initControls();
        computeAxes();
        connectWebSocket();
        setInterval(tick, 120);
        setInterval(requestStatus, 1200);
    </script>
</body>
</html>
