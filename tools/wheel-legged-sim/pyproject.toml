[project]
name = "wheel-legged-sim"
version = "0.1.0"
description = "MuJoCo simulation MCP server for wheel-legged robot"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.13.1",
    "mujoco>=3.3.5",
    "numpy>=1.26.0",
    "pillow>=11.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wheel_leg_sim"]
